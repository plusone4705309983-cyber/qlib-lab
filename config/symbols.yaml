# 股票池配置
# qlib:  qlib 内部 instrument 名（也是 CSV 文件名，小写）
# secid: 东方财富 secid 格式 市场前缀.代码
#   沪市 1. / 深市+创业板+北交所 0. / NASDAQ 105. / NYSE 106. / AMEX 107.

markets:
  cn:
    qlib_region: cn
    csv_dir: data/selfmade/cn
    bin_dir: data/selfmade/cn_bin
    symbols:
      - { qlib: sh600519, secid: "1.600519",  tencent: sh600519,  name: "贵州茅台" }
      - { qlib: sz000001, secid: "0.000001",  tencent: sz000001,  name: "平安银行" }
      - { qlib: sz300750, secid: "0.300750",  tencent: sz300750,  name: "宁德时代" }
      - { qlib: sh601318, secid: "1.601318",  tencent: sh601318,  name: "中国平安" }

  us:
    qlib_region: us
    csv_dir: data/selfmade/us
    bin_dir: data/selfmade/us_bin
    symbols:
      - { qlib: aapl, secid: "105.AAPL",  tencent: usAAPL.OQ,  name: "苹果"   }
      - { qlib: tsla, secid: "105.TSLA",  tencent: usTSLA.OQ,  name: "特斯拉" }
      - { qlib: nvda, secid: "105.NVDA",  tencent: usNVDA.OQ,  name: "英伟达" }
      - { qlib: msft, secid: "105.MSFT",  tencent: usMSFT.OQ,  name: "微软"   }
