<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>邀请码注册 · Qlib 数据检视器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">Qlib 数据检视器</div>
    <h1>邀请码注册</h1>
    <p class="auth-text">
      输入管理员给你的邀请码，并设置你的登录邮箱和密码。
      注册后这个邮箱就是你的账号，不需要 Gmail 或 Google 账号。
    </p>

    {% if error %}
      <div class="auth-error" role="alert">{{ error }}</div>
    {% endif %}

    <form class="auth-form" method="post" action="/invite" autocomplete="off">
      <label for="invite-code">邀请码</label>
      <input id="invite-code" name="code" value="{{ preset_code }}"
             placeholder="INV-XXXX-XXXX" spellcheck="false" autofocus required>

      <label for="invite-email">邮箱</label>
      <input id="invite-email" name="email" type="email" value="{{ email }}"
             autocomplete="username" placeholder="you@example.com" required>

      <label for="invite-password">设置密码</label>
      <input id="invite-password" name="password" type="password"
             autocomplete="new-password" minlength="8" maxlength="128"
             placeholder="至少 8 位" required>

      <label for="invite-confirm">确认密码</label>
      <input id="invite-confirm" name="confirm" type="password"
             autocomplete="new-password" minlength="8" maxlength="128"
             placeholder="再输入一次" required>

      <button class="btn btn-primary" type="submit">创建账号并进入</button>
    </form>

    <p class="auth-hint">
      邀请码一次性使用、默认 72 小时有效。邮箱只用于登录，不会公开显示。
    </p>
    <p class="auth-hint">
      已经有账号？<a href="/login">直接登录</a>
    </p>
  </main>
</body>
</html>
